; Pool de php-fpm de Inventario Avícola.
;
; php-fpm es el proceso que ejecuta PHP: nginx le pasa cada petición a index.php por el puerto 9000
; y php-fpm la reparte entre varios procesos "trabajadores". Este archivo se carga después de los
; de la imagen oficial (zz-inventario.conf va después de zz-docker.conf) y pisa sus valores.
;
; Nota: el contenedor corre sin root (usuario www-data), así que php-fpm avisa al arrancar que
; ignora las líneas "user" y "group" de www.conf. Es esperado: ya es www-data.

[www]
; Cantidad de trabajadores: hasta 6 peticiones a la vez, suficiente para un equipo pequeño
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Cada trabajador se reinicia después de 500 peticiones (evita que una fuga de memoria crezca)
pm.max_requests = 500

; Una petición que tarde más de 60 s se corta (no deja un proceso colgado para siempre)
request_terminate_timeout = 60s

; Solo se ejecutan archivos .php (nginx además solo le pasa index.php)
security.limit_extensions = .php
