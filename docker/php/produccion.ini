; Ajustes de PHP para el contenedor de Inventario Avícola.
;
; El Dockerfile copia el php.ini-production oficial como php.ini y después este archivo como
; conf.d/zz-inventario.ini: lo que está aquí pisa los valores de php.ini.

; --- Información y errores -----------------------------------------------------------------
; No anunciar la versión de PHP (sin cabecera X-Powered-By)
expose_php = Off
; Nunca mostrar errores en la página (podrían mostrar rutas, consultas o datos internos);
; se registran en el log del contenedor (docker compose logs app)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; --- Límites --------------------------------------------------------------------------------
; La app no sube archivos: formularios chicos y peticiones cortas.
; 128M por proceso cabe en el límite de memoria del contenedor (compose.yaml) con varios procesos.
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 2M
upload_max_filesize = 1M
max_file_uploads = 2

; Zona horaria por defecto de PHP (Laravel igual usa la de config/app.php)
date.timezone = America/Bogota

; --- OPcache --------------------------------------------------------------------------------
; Guarda el código PHP ya compilado en memoria: no se vuelve a leer y compilar en cada petición
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor (es de solo lectura): no hace falta revisar si los
; archivos cambiaron. Para cambiar el código se construye una imagen nueva.
opcache.validate_timestamps = 0
