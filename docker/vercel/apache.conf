# Servidor web de la imagen para Vercel (etapa "vercel" del Dockerfile, docs/vercel.md).
#
# Apache con PHP integrado (mod_php) de la imagen oficial php:8.4.x-apache: un solo proceso sirve
# public/ y ejecuta index.php. Vercel corre una sola imagen, así que aquí no hay nginx y php-fpm
# en contenedores separados como en la pila Docker local (docker/nginx/default.conf); las reglas
# son las mismas. Este archivo reemplaza al sitio por defecto de la imagen (000-default.conf).

ServerName localhost

# No decir versiones: la cabecera Server dice solo "Apache" y las páginas de error no llevan firma
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Los formularios de la app son chicos: 2 MB, igual que nginx y post_max_size de PHP
LimitRequestBody 2097152

# ${PORT}: el puerto donde Vercel le habla al contenedor (80 si no se define; ver el Dockerfile)
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options None
        # public/.htaccess se ignora: todo lo necesario está en este archivo
        AllowOverride None
        Require all granted
        # Si no es un archivo de public/, lo resuelve Laravel (como el try_files de nginx)
        FallbackResource /index.php
    </Directory>

    # Archivos y carpetas ocultos (.env, .git, .htaccess...): como si no existieran
    RedirectMatch 404 "/\."

    # El único PHP que se ejecuta es index.php; cualquier otro .php se rechaza
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
        # Sin compresión en las páginas de PHP: llevan el token CSRF, y comprimirlo junto con
        # texto que escribe el usuario facilita el ataque BREACH sobre HTTPS. Los estáticos (CSS,
        # JS, fuentes) sí se comprimen.
        SetEnv no-gzip 1
    </Files>

    # Las mismas cabeceras de seguridad de docker/nginx/cabeceras-seguridad.conf
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    # Three.js y las fuentes casi nunca cambian: el navegador los guarda un año. Es seguro porque
    # Three.js vive en una carpeta con su versión (/js/vendor/three-r186/).
    <LocationMatch "^/(js/vendor|fonts)/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Logs a la salida del contenedor: la imagen oficial enlaza estos archivos a stdout y stderr,
    # y Vercel los muestra en sus logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
