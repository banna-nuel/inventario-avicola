# Cabeceras de seguridad que nginx agrega a todas las respuestas (páginas, archivos y errores).
#
# Está en un archivo aparte porque en nginx, si un bloque "location" agrega sus propias cabeceras
# (add_header), deja de heredar las del bloque "server". Los bloques con caché larga de
# default.conf incluyen este archivo otra vez para no perderlas.
# "always" = también en respuestas de error (404, 500...).

# El navegador no "adivina" el tipo de un archivo: un .js se trata como JavaScript solo si el
# servidor dice que lo es (evita que un archivo mal servido se ejecute como script)
add_header X-Content-Type-Options "nosniff" always;

# Ninguna otra página puede mostrar la app dentro de un <iframe> (evita el "clickjacking":
# engañar a alguien para que haga click en la app escondida debajo de otra página)
add_header X-Frame-Options "DENY" always;

# Al seguir un enlace a otro sitio, solo se envía el dominio, no la ruta completa (las rutas
# pueden tener nombres de productos o filtros)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La app no usa cámara, micrófono, ubicación ni sensores: se le niegan a la página y a lo que cargue
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy (CSP): PENDIENTE. La define la auditoría de seguridad. La app ya está
# preparada (sin scripts externos ni inline; hay un <style> inline en el <head> con la regla de
# View Transitions), pero una CSP mal armada rompe páginas, así que se agrega y se prueba en esa
# fase. Con CSP, la directiva frame-ancestors 'none' reemplazaría a X-Frame-Options.

# Strict-Transport-Security (HSTS): solo tiene sentido con HTTPS. Esta pila sirve HTTP local
# (127.0.0.1:8080); al publicarla con HTTPS se agrega aquí.
