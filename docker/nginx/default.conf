# Servidor web de Inventario Avícola (servicio "web" de compose.yaml).
#
# nginx recibe todas las peticiones del navegador:
#   - los archivos de public/ (CSS, JS, fuentes, imágenes) los sirve él mismo, rápido;
#   - todo lo demás se lo pasa a Laravel: a php-fpm (servicio "app", puerto 9000), solo por index.php.
# Este archivo reemplaza al default.conf de la imagen y queda dentro del bloque "http" de
# /etc/nginx/nginx.conf.

# No decir la versión de nginx (ni en la cabecera Server ni en las páginas de error)
server_tokens off;

# Compresión gzip para los archivos de texto estáticos: se transfieren mucho más livianos.
# Las páginas de PHP no se comprimen (ver location = /index.php).
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

server {
    # Puerto dentro del contenedor (nginx sin privilegios no puede usar el 80). compose.yaml lo
    # publica solo en 127.0.0.1:8080 del equipo.
    listen 8080;
    server_name _;

    root /var/www/html/public;
    charset utf-8;

    # Los formularios de la app son chicos (igual que post_max_size de PHP)
    client_max_body_size 2m;

    # DNS interno de Docker: "app" se busca en cada petición (si el contenedor app se reinicia y
    # cambia de IP, nginx lo sigue encontrando, y nginx arranca aunque app todavía no esté)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    # Archivos y carpetas ocultos (.env, .git, .htaccess...): como si no existieran
    location ~ /\. {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Three.js y las fuentes casi nunca cambian: el navegador los guarda un año sin volver a
    # preguntar ("immutable"). El CSS y el JS propios no van aquí: llevan ?v=... en la URL y se
    # renuevan solos cuando cambian.
    # Ojo: los archivos de vendor no llevan la versión en el nombre. Al actualizar Three.js hay que
    # cambiarles el nombre o la carpeta, o el navegador seguiría usando la copia vieja (docs/docker.md).
    location /js/vendor/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Lo demás: si es un archivo de public/, se sirve; si no, lo resuelve Laravel
    location / {
        try_files $uri /index.php?$query_string;
    }

    # El único PHP que se ejecuta. "internal": no se puede pedir /index.php directamente, solo
    # se llega aquí desde el try_files de arriba.
    location = /index.php {
        internal;

        # Sin gzip en las páginas de PHP: llevan el token CSRF, y comprimirlo junto con texto que
        # escribe el usuario facilita el ataque BREACH (relevante cuando haya HTTPS)
        gzip off;

        fastcgi_pass $php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # Evita "httpoxy": una cabecera Proxy enviada por el navegador no puede convertirse en la
        # variable HTTP_PROXY que usan algunas librerías
        fastcgi_param HTTP_PROXY "";
        # Por si PHP la enviara: nunca mostrar X-Powered-By (expose_php ya está en Off)
        fastcgi_hide_header X-Powered-By;
    }

    # Cualquier otro .php (aunque existiera en public/): no se ejecuta
    location ~ \.php$ {
        return 404;
    }
}
